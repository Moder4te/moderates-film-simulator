# 엔진(색)만 담은 안드로이드 APK를 빌드한다.
#
# 이 저장소의 개발 컨테이너에는 Android SDK가 없어 APK는 여기서만 만든다.
# 결과는 Actions 실행 페이지의 Artifacts(`film-sim-engine-apk`)에 올라가고,
# `v*` 태그로 돌 때는 같은 이름의 릴리스에도 붙인다.
#
# 서명 — 저장소 시크릿 `ANDROID_KEYSTORE_BASE64`(·`_PASSWORD`·`ANDROID_KEY_ALIAS`·
# `ANDROID_KEY_PASSWORD`)가 있으면 그 키로, 없으면 디버그 키로 서명한다. 디버그 키는
# 실행마다 새로 생겨 **덮어쓰기 업데이트가 안 된다**(지우고 다시 설치해야 한다).

name: android

on:
  push:
    # tags만 두면 브랜치 푸시에서는 돌지 않는다 — branches를 같이 적어야 한다.
    branches: ["**"]
    paths:
      - "android/**"
      - "core/color/**"
      - "apps/engine/src/params.js"
      - "apps/engine/manifest.json"
      - "tools/build-android-web.js"
      - "tools/check-raw-native.py"
      - "tools/check-ftp.py"
      - "tools/decode-raw.py"
      - ".github/workflows/android.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "android/**"
      - "core/color/**"
      - "apps/engine/src/params.js"
      - "tools/build-android-web.js"
      - "tools/check-raw-native.py"
      - "tools/check-ftp.py"
      - "tools/decode-raw.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 폰의 네이티브 RAW 현상이 tools/decode-raw.py(rawpy)와 화소 단위로 같은가,
  # 네이티브 LUT 적용이 엔진(core/color/lut.js)과 같은가, FTP 받기 서버가 규약대로 도는가.
  raw-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install rawpy numpy
      - name: 호스트용 현상 도구 빌드
        run: |
          cmake -S android/app/src/main/cpp -B build/raw-native
          cmake --build build/raw-native -j
      - name: 표본 RAW (rawpy 저장소의 시험 파일)
        run: |
          mkdir -p build/raw-samples
          curl -sSfL -o build/raw-samples/sample.NEF https://raw.githubusercontent.com/letmaik/rawpy/main/test/iss030e122639.NEF
      - run: python tools/check-raw-native.py build/raw-native/filmsim-raw-cli build/raw-samples/sample.NEF
      # 카메라 FTP 받기 서버를 실제 FTP 클라이언트(ftplib)로 — 러너의 JDK로 돈다
      - run: python tools/check-ftp.py

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Android SDK는 ubuntu-latest 러너에 이미 있다(ANDROID_HOME). setup-android@v3는
      # 없어진 `tools` 패키지를 설치하려다 실패해서 쓰지 않는다.

      - name: 서명 키
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FILMSIM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "릴리스 키 시크릿 없음 — 디버그 키로 서명한다"
          fi

      - name: APK 빌드
        working-directory: android
        env:
          FILMSIM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FILMSIM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FILMSIM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          VERSION=$(node -p 'require("../apps/engine/manifest.json").version')
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/film-sim-engine-$VERSION.apk"
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: film-sim-engine-apk
          path: dist/*.apk

      - name: 릴리스에 첨부 (태그일 때)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber || echo "릴리스 ${GITHUB_REF_NAME} 가 없어 첨부를 건너뛴다"
