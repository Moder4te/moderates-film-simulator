import groovy.json.JsonSlurper

plugins {
    id "com.android.application"
}

// 버전은 Photoshop 엔진 플러그인과 같은 것을 쓴다 — 같은 core/color를 싣기 때문이다.
def repoRoot = rootProject.projectDir.parentFile
def engineVersion = new JsonSlurper().parse(new File(repoRoot, "apps/engine/manifest.json")).version
def (vMajor, vMinor, vPatch) = engineVersion.tokenize(".").collect { it as int }

// 릴리스 서명 키는 환경 변수로만 받는다(CI 시크릿). 없으면 디버그 키로 서명해
// 설치는 되게 한다 — 그때는 빌드마다 키가 달라 업데이트 설치가 안 될 수 있다.
def keystoreFile = System.getenv("FILMSIM_KEYSTORE")
def hasReleaseKey = keystoreFile && new File(keystoreFile).exists()

android {
    namespace "com.filmsim.engine"
    compileSdk 35

    defaultConfig {
        applicationId "com.filmsim.engine"
        minSdk 29
        targetSdk 35
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName engineVersion
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv("FILMSIM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("FILMSIM_KEY_ALIAS")
                keyPassword System.getenv("FILMSIM_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}

// WebView 자산(엔진 번들)은 core/color에서 매번 새로 만든다. 저장소에는 원본만 있다.
def buildWeb = tasks.register("buildWebAssets", Exec) {
    workingDir repoRoot
    commandLine "node", "tools/build-android-web.js"
}
preBuild.dependsOn buildWeb
